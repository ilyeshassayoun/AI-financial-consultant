name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: financial_consultant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d financial_consultant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify PostgreSQL migrations
        run: |
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini downgrade 20260914_0002
          python -m alembic -c alembic.ini upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/financial_consultant_test
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        env:
          DATABASE_URL: ""
          TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/financial_consultant_test
          GROQ_API_KEY: ""
          JWT_SECRET_KEY: "test-secret-key-for-ci-abc123"

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
